
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speedometer</title>
<style>
*{box-sizing:border-box}
body{background:#080d16;color:white;font-family:Arial;text-align:center;margin:0;padding:35px 10px}
h1{color:#58c7ff;letter-spacing:4px}
.gauge{width:300px;height:300px;border:9px solid #263c55;border-radius:50%;margin:35px auto;background:radial-gradient(circle,#182638,#080d16);display:flex;align-items:center;justify-content:center;position:relative}
.speed{font-size:75px;font-weight:bold}
.unit{color:#58c7ff;letter-spacing:4px}
.needle{position:absolute;width:4px;height:110px;background:#ff405c;bottom:50%;left:calc(50% - 2px);transform-origin:bottom;transform:rotate(-135deg);border-radius:5px}
.center{position:absolute;width:17px;height:17px;background:white;border-radius:50%}
button{background:#168dff;color:white;border:0;padding:16px 35px;border-radius:30px;font-size:18px;margin:20px}
.stats{display:flex;justify-content:center;gap:50px;color:#9db4ce}
strong{display:block;color:white;font-size:25px;margin-top:8px}
#status{color:#58c7ff}
</style>
</head>
<body>
<h1>SPEEDOMETER</h1>
<div class="gauge">
<div>
<div class="speed" id="speed">0</div>
<div class="unit">KM/H</div>
</div>
<div class="needle" id="needle"></div>
<div class="center"></div>
</div>
<div id="status">GPS OFFLINE</div>
<button id="toggle">START GPS</button>
<div class="stats">
<div>MAX SPEED<strong id="max">0</strong></div>
<div>ACCURACY<strong id="accuracy">--</strong></div>
</div>
<script>
let watching=null,target=0,current=0,max=0;
const speedEl=document.getElementById("speed");
const needle=document.getElementById("needle");

function animate(){
current+=(target-current)*0.12;
speedEl.textContent=Math.round(current);
needle.style.transform=`rotate(${-135+Math.min(current/200,1)*270}deg)`;
requestAnimationFrame(animate);
}
animate();

document.getElementById("toggle").onclick=function(){
if(watching!==null){
navigator.geolocation.clearWatch(watching);
watching=null;target=0;
document.getElementById("status").textContent="GPS OFFLINE";
this.textContent="START GPS";
return;
}
document.getElementById("status").textContent="WAITING FOR GPS...";
watching=navigator.geolocation.watchPosition(p=>{
let c=p.coords;
target=c.speed==null?0:Math.max(0,c.speed*3.6);
max=Math.max(max,target);
document.getElementById("max").textContent=Math.round(max);
document.getElementById("accuracy").textContent=Math.round(c.accuracy)+"m";
document.getElementById("status").textContent="GPS CONNECTED";
},e=>{
document.getElementById("status").textContent="GPS ERROR: "+e.message;
navigator.geolocation.clearWatch(watching);
watching=null;
document.getElementById("toggle").textContent="START GPS";
},{enableHighAccuracy:true,maximumAge:0,timeout:15000});
this.textContent="STOP GPS";
};
</script>
</body>
</html>
